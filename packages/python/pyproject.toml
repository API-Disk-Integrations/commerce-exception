[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "commerce-exception"
version = "1.0.0"
description = "Detect and resolve order, payment, inventory, shipping and support exceptions with idempotent actions and receipts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "API Disk Integrations" }]
keywords = ["api", "sdk", "commerce-exception"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[tool.hatch.build]
ignore-vcs = true

[project.urls]
Homepage = "https://commerceexception-api.com/"
Documentation = "https://commerceexception-api.com/#docs"
Pricing = "https://commerceexception-api.com/#pricing"
Privacy = "https://commerceexception-api.com/privacy"
Terms = "https://commerceexception-api.com/terms"
Source = "https://github.com/API-Disk-Integrations/commerce-exception"
Issues = "https://github.com/API-Disk-Integrations/commerce-exception/issues"
Changelog = "https://github.com/API-Disk-Integrations/commerce-exception/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_exception"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/commerce_exception/__init__.py",
]
